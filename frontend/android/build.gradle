// Top-level build file
apply from: "variables.gradle"

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.1.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.gms:google-services:4.4.0"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
        }
    }

configurations.all {
    resolutionStrategy {
        // SDK 33 compatible AndroidX
        force "androidx.appcompat:appcompat:1.6.1"
        force "androidx.appcompat:appcompat-resources:1.6.1"

        force "androidx.activity:activity:1.7.2"
        force "androidx.fragment:fragment:1.6.2"

        force "androidx.core:core:1.10.1"
        force "androidx.core:core-ktx:1.10.1"

        force "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
        force "androidx.webkit:webkit:1.7.0"

        force "androidx.profileinstaller:profileinstaller:1.3.1"
    }
}

}

task clean(type: Delete) {
    delete rootProject.buildDir
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = "17"
        targetCompatibility = "17"
    }
    
    afterEvaluate {
        if (project.hasProperty("android")) {
            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}
